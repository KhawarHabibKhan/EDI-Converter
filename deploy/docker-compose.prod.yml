# Production stack: Caddy edge (TLS + headers) -> SPA + API on one origin.
#
#   cd deploy
#   cp .env.production.example .env && edit it
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Differences from the development docker-compose.yml at the repo root:
#   * only Caddy publishes ports — the API is NOT reachable from outside the
#     Docker network, so it cannot be hit directly, bypassing TLS and headers;
#   * the frontend is built with VITE_API_URL=/api (same-origin, no CORS);
#   * TLS certificates are issued and renewed automatically by Caddy.
name: edi-converter

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Host ports are variables so the same file can be rehearsed locally on a
    # spare port before it is pointed at a real domain — see deploy/README.md
    # ("Rehearse the production topology locally").
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"   # HTTP/3
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env (e.g. edi.example.com)}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      MAX_UPLOAD_SIZE: ${MAX_UPLOAD_SIZE:-12MB}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data       # issued certificates — persist or you will re-issue on every deploy
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE       # the only capability needed: binding 80/443
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

  backend:
    build: ../backend
    restart: unless-stopped
    expose:
      - "5080"                 # internal only — never published to the host
    environment:
      # Same-origin deployment: the browser calls /api on the Caddy host, so no
      # cross-origin request is ever made. Kept explicit to lock CORS down.
      EDI_CORS_ORIGINS: "https://${SITE_ADDRESS}"
      EDI_MAX_FILE_MB: ${EDI_MAX_FILE_MB:-10}
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  frontend:
    build:
      context: ../frontend
      args:
        # Relative base -> same-origin requests through the Caddy edge.
        VITE_API_URL: "/api"
    restart: unless-stopped
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M

volumes:
  caddy_data:
  caddy_config:
