server {
  # 8080, not 80: the image runs as an unprivileged user, which cannot bind to
  # a port below 1024. The host mapping in docker-compose.yml hides this.
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Single-page app: fall back to index.html for client-side routes.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
